<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00ffe7"/>
      <stop offset="50%"  stop-color="#7c00ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon -->
  <polygon
    points="30,3 54,16.5 54,43.5 30,57 6,43.5 6,16.5"
    fill="none"
    stroke="url(#logoGrad)"
    stroke-width="1.5"
    filter="url(#logoGlow)"
  />

  <!-- Inner hexagon -->
  <polygon
    points="30,10 48,20 48,40 30,50 12,40 12,20"
    fill="none"
    stroke="url(#logoGrad)"
    stroke-width="0.8"
    opacity="0.4"
  />

  <!-- MM text -->
  <text
    x="50%"
    y="56%"
    font-family="Orbitron, monospace"
    font-size="18"
    font-weight="900"
    fill="url(#logoGrad)"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#logoGlow)"
    letter-spacing="1"
  >MM</text>

  <!-- Corner dots -->
  <circle cx="30"   cy="3"    r="2"   fill="#00ffe7" opacity="0.8"/>
  <circle cx="54"   cy="16.5" r="1.5" fill="#7c00ff" opacity="0.6"/>
  <circle cx="54"   cy="43.5" r="1.5" fill="#ff00aa" opacity="0.6"/>
  <circle cx="30"   cy="57"   r="2"   fill="#00ffe7" opacity="0.8"/>
  <circle cx="6"    cy="43.5" r="1.5" fill="#7c00ff" opacity="0.6"/>
  <circle cx="6"    cy="16.5" r="1.5" fill="#ff00aa" opacity="0.6"/>
</svg>